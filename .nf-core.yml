repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/workflows/branch.yml
    - LICENSE
    - .prettierignore
    - docs/CONTRIBUTING.md
    - CODE_OF_CONDUCT.md
    - assets/nf-core-DecoNFlow_logo_light.png
    - docs/images/nf-core-DecoNFlow_logo_light.png
    - docs/images/nf-core-DecoNFlow_logo_dark.png
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - assets/sendmail_template.txt
  # nf-core/tools does not support typed parameters yet (https://nf-co.re/blog/2026/parameter-types)
  nextflow_config: false
  schema_params: false
  multiqc_config: false
  nf_test_content: false
  files_exist:
    - conf/test_full.config
    - ro-crate-metadata.json
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-DecoNFlow_logo_light.png
    - docs/images/nf-core-DecoNFlow_logo_light.png
    - docs/images/nf-core-DecoNFlow_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - assets/multiqc_config.yml

template:
  org: VIBTOBIlab
  name: DecoNFlow
  description: DecoNFlow is a bioinformatics analysis pipeline used for computational
    deconvolution of DNA methylation data. It allows deconvolution of samples using
    both reference-based and reference-free deconvolution tools.
  author: Edoardo Giuili
  version: 2.5.0
  force: false
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - gpu
    - email
    - seqera_platform
    - rocrate
    - codespaces
  is_nfcore: false
