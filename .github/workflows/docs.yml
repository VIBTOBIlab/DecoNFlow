name: Documentation
# Builds the documentation website with MkDocs on pull requests, and publishes it
# to GitHub Pages on pushes to the branch below.
# Switch the branch to `main` once dev-refactoring is released.
on:
  push:
    branches:
      - dev-refactoring
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "nextflow_schema.json"
      - "CHANGELOG.md"
      - "CITATIONS.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      # --strict fails the build on broken links and anchors
      - name: Build the documentation
        run: mkdocs build --strict

      - name: Upload the website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
